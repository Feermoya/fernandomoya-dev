<body>
<div id="root"></div>
<script>
const S=(paths,sz=20)=>`<svg xmlns="http://www.w3.org/2000/svg" width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
const icons={
 ball:S('<circle cx="12" cy="12" r="9"/><path d="m9 9 3-2 3 2 1 4-4 3-4-3 1-4ZM3.8 7l4 2M20.2 7l-4 2M5 18l3-5M19 18l-3-5M12 21v-5"/>'),
 grid:S('<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'),
 match:S('<path d="M3 6h18M3 12h18M3 18h18"/><circle cx="8" cy="6" r="2" fill="currentColor" stroke="none"/><circle cx="16" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="10" cy="18" r="2" fill="currentColor" stroke="none"/>'),
 chart:S('<path d="M4 20V11M10 20V4M16 20v-8M22 20V7"/>'),
 trophy:S('<path d="M8 4h8v6c0 4-2 6-4 6s-4-2-4-6V4ZM8 6H4v3a4 4 0 0 0 4 4M16 6h4v3a4 4 0 0 1-4 4M12 16v4M8 21h8"/>'),
 clock:S('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
 users:S('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>'),
 plus:S('<path d="M12 5v14M5 12h14"/>'),
 chevron:S('<path d="m9 18 6-6-6-6"/>'),
 close:S('<path d="M18 6 6 18M6 6l12 12"/>'),
 bolt:S('<path d="m13 2-9 12h7l-1 8 10-12h-7l0-8Z"/>'),
 spark:S('<path d="m12 3 1.8 6.2L20 11l-6.2 1.8L12 19l-1.8-6.2L4 11l6.2-1.8L12 3ZM20 18l.7 1.3L22 20l-1.3.7L20 22l-.7-1.3L18 20l1.3-.7L20 18Z"/>'),
 share:S('<path d="M12 16V3m-5 5 5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>'),
 shuffle:S('<path d="m18 14 4 4-4 4M18 2l4 4-4 4M2 18h4c6 0 6-12 12-12h4M2 6h4c2 0 3 .9 4 2M14 16c1 1.2 2 2 4 2h4"/>'),
 calendar:S('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/>'),
 settings:S('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.05.06-2 2-.06-.05A1.7 1.7 0 0 0 16 18.56l-1-.42a1.7 1.7 0 0 0-1.1 1.43V21h-3v-1.43A1.7 1.7 0 0 0 9.8 18.14l-1 .42a1.7 1.7 0 0 0-1.88.34l-.06.05-2-2 .05-.06A1.7 1.7 0 0 0 5.25 15l-.42-1a1.7 1.7 0 0 0-1.43-1.1H2v-3h1.4A1.7 1.7 0 0 0 4.83 8.8l.42-1a1.7 1.7 0 0 0-.34-1.88l-.05-.06 2-2 .06.05a1.7 1.7 0 0 0 1.88.34l1-.42A1.7 1.7 0 0 0 10.9 2.4V1h3v1.4a1.7 1.7 0 0 0 1.1 1.43l1 .42a1.7 1.7 0 0 0 1.88-.34l.06-.05 2 2-.05.06A1.7 1.7 0 0 0 19.56 7.8l.42 1A1.7 1.7 0 0 0 21.4 9.9H23v3h-1.4a1.7 1.7 0 0 0-1.43 1.1L19.4 15Z"/>'),
 download:S('<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>'),
 back:S('<path d="m15 18-6-6 6-6"/>')
};
const $=(s)=>document.querySelector(s);const playerNames=['Ale','Fer','Mati','Fabri','Franco','Rodri'];const faceColors=['#455d93','#916a52','#775a9c','#4c846d','#84624f','#756b4e'];
const seed=[{id:1,mode:'2v2',a:['Ale','Fer'],b:['Mati','Fabri'],sa:3,sb:1},{id:2,mode:'2v2',a:['Franco','Rodri'],b:['Ale','Fer'],sa:0,sb:2},{id:3,mode:'2v2',a:['Mati','Franco'],b:['Fabri','Rodri'],sa:2,sb:2},{id:4,mode:'2v2',a:['Ale','Fer'],b:['Mati','Franco'],sa:4,sb:2}];
const state={page:'inicio',rankMode:'parejas',scope:'fecha',filter:'todos',matches:structuredClone(seed),playing:true,modal:null,selected:[],gameMode:'2v2',inputMode:'marcador',sa:0,sb:0,quickWinner:'a',awardMvp:'',awardGol:'',finished:false,toast:'',noticeTimer:0};
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function face(name,size='small'){const i=playerNames.indexOf(name);return `<span class="${size==='small'?'player-face':'av-small'}" style="background:${faceColors[i]||'#6e7a63'}">${escapeHTML(name[0])}</span>`;}
function ranks(mode='parejas'){
 const map=new Map(); const byMode=state.matches.filter(x=>(mode==='uno'?x.mode==='1v1':x.mode==='2v2'));
 for(const m of byMode){const sides=[{members:m.a,score:m.sa,opp:m.sb},{members:m.b,score:m.sb,opp:m.sa}];
 for(const side of sides){const people=mode==='parejas'?[side.members.slice().sort((a,b)=>a.localeCompare(b)).join(' + ')]:side.members;
 for(const who of people){let r=map.get(who);if(!r){r={name:who,pj:0,g:0,e:0,p:0,pts:0,gd:0,exact:0};map.set(who,r)}r.pj++;const result=m.quick?( (m.winner==='a' && side===sides[0]) || (m.winner==='b' && side===sides[1])?'g':'p'):side.score>side.opp?'g':side.score===side.opp?'e':'p';if(result==='g'){r.g++;r.pts+=3}else if(result==='e'){r.e++;r.pts++}else if(result==='p'){r.p++}if(!m.quick&&Number.isFinite(side.score)&&Number.isFinite(side.opp)){r.gd+=side.score-side.opp;r.exact++}
 }} }
 return [...map.values()].sort((a,b)=>b.pts-a.pts||b.g-a.g||b.gd-a.gd||a.name.localeCompare(b.name,'es'));
}
function modeLabel(m){return m==='2v2'?'2 VS 2':'1 VS 1'}
function matchesPanel(count=3){const data=[...state.matches].reverse().slice(0,count);if(!data.length)return `<div class="empty">${icons.ball}<h3>TODAVÍA NO HAY PARTIDOS</h3><p>La primera victoria está a un resultado de distancia.</p></div>`;
return `<div class="matches">${data.map(m=>`<div class="match"><div class="match-index">#${String(m.id).padStart(2,'0')}</div><div class="match-team">${escapeHTML(m.a.join(' + '))}<span class="team-mini">${modeLabel(m.mode)}</span></div><div class="score-block"><span class="${(m.quick?m.winner==='a':m.sa>m.sb)?'winner':''}">${m.quick?(m.winner==='a'?'V':'D'):m.sa}</span><i>:</i><span class="${(m.quick?m.winner==='b':m.sb>m.sa)?'winner':''}">${m.quick?(m.winner==='b'?'V':'D'):m.sb}</span></div><div class="match-team right">${escapeHTML(m.b.join(' + '))}<span class="team-mini">${m.quick?(m.winner==='a'?'GANÓ LOCAL':'GANÓ VISITA'):m.sa===m.sb?'EMPATE':m.sa>m.sb?'GANÓ LOCAL':'GANÓ VISITA'}</span></div></div>`).join('')}</div>`;
}
function standingTop(){const rr=ranks('parejas');return `<div class="aside-card"><div class="heading"><div><span class="over">TABLA EN VIVO</span><h3>EL PODIO</h3></div><span class="icon-round">${icons.trophy}</span></div>${rr.length?rr.slice(0,4).map((r,i)=>`<div class="standing ${i===0?'first':''}"><div class="pos">${String(i+1).padStart(2,'0')}</div><div><span class="who">${escapeHTML(r.name)}</span><span class="record">${r.g}V · ${r.e}E · ${r.p}D</span></div><div class="pts">${r.pts}<small>PTS</small></div></div>`).join(''):'<div style="padding:20px;color:#8ea29a;font-size:12px">Todavía no hay partidos.</div>'}<button class="aside-footer" data-page="ranking">VER TABLA COMPLETA →</button></div>`}
function roster(){return `<div class="roster">${playerNames.map(n=>`<span class="player-tag">${face(n)}${n}</span>`).join('')}</div>`}
function sideExtra(){return `<div class="awards-banner"><span class="award-hd">${icons.trophy}<span class="small-lime" style="color:var(--gold)">EL TERCER TIEMPO</span></span><h3>QUE HABLEN LOS PREMIOS</h3><p>MVP, mejor gol y las cargadas de siempre. Los eligen cuando termina la noche.</p><button data-modal="awards">ELEGIR PREMIOS →</button></div><div class="group-panel"><h3>LA BANDA</h3><p>6 jugadores en el plantel de FIFA.</p>${roster()}</div>`}
function headerPage(){const p=state.page;const dict={inicio:'Inicio',partidos:'Partidos',ranking:'Ranking',historial:'Historial'};return `<div class="page-intro"><div><div class="eyebrow">FIFA <span class="slash">/</span> FECHA 01 <span class="slash">/</span> ${state.finished?'CERRADA':'EN JUEGO'}</div><h1 class="page-title">${{inicio:'EL VESTUARIO',partidos:'PARTIDOS',ranking:'LA TABLA',historial:'HISTORIAL'}[p]}</h1><p class="page-desc">${{inicio:'Donde cada juntada tiene su historia.',partidos:'Cada resultado cambia la historia de la noche.',ranking:'Los números no mienten. Las excusas tampoco.',historial:'Las noches pasan. Los resultados quedan.'}[p]}</p></div><button class="circle-tool" data-modal="info" title="Sobre este prototipo">${icons.settings}</button></div>`}
function homePage(){const rr=ranks('parejas'),leader=rr[0],m=state.matches.length;return `${headerPage()}${state.finished?finishedView():`<section class="hero"><svg class="pitch" viewBox="0 0 410 450" fill="none" stroke="#e5f9c4" stroke-width="2"><rect x="25" y="25" width="360" height="400" rx="2"/><path d="M25 225h360"/><circle cx="205" cy="225" r="65"/><circle cx="205" cy="225" r="3" fill="currentColor"/><rect x="111" y="25" width="188" height="68"/><rect x="111" y="357" width="188" height="68"/><path d="M155 93a55 55 0 0 0 100 0M155 357a55 55 0 0 1 100 0"/></svg><div class="hero-noise"></div><div class="hero-shine"></div><div class="hero-watermark">01</div><div class="hero-inner"><div class="hero-kicker">FECHA 01 · EN JUEGO</div><h2 class="hero-title">HOY SE<br/><span>JUEGA.</span></h2><p class="hero-sub">Hay rivalidades que no se arreglan hablando.</p><div class="hero-bottom"><button class="primary-btn" data-modal="match">${icons.plus} CARGAR RESULTADO ${icons.chevron}</button><span class="hero-counter"><strong>${String(m).padStart(2,'0')}</strong><small>PARTIDOS<br/>JUGADOS</small></span><span class="hero-counter"><strong>06</strong><small>JUGADORES<br/>EN CANCHA</small></span></div></div></section>`}<section class="stat-strip"><div class="stat"><span class="stat-icon">${icons.ball}</span><span><span class="number">${m}</span><small>Partidos</small></span></div><div class="stat"><span class="stat-icon">${icons.users}</span><span><span class="number">6</span><small>Jugadores</small></span></div><div class="stat"><span class="stat-icon">${icons.bolt}</span><span><span class="number">${leader?leader.g:'0'}</span><small>Victorias del líder</small></span></div></section><div class="section-header"><h2 class="section-title">LOS QUE MANDAN</h2><button class="section-link" data-page="ranking">VER RANKING ${icons.chevron}</button></div>${leader?`<div class="leader-card"><div><div class="leader-label">${icons.trophy} PAREJA LÍDER</div><div class="leader-names">${leader.name.split(' + ').map(escapeHTML).join(' <em>+</em> ')}</div><div class="leader-desc"><b>${leader.g} victorias</b> · ${leader.p===0?'Invictos hasta ahora':leader.p+' derrotas'} · ${leader.pts} puntos</div></div><div class="leader-medallion">${icons.trophy}</div></div>`:`<div class="empty">${icons.trophy}<h3>EL TRONO ESTÁ VACÍO</h3><p>La primera pareja ganadora aparece cuando cargues un partido.</p></div>`}<div class="section-spacer"></div><div class="section-header"><h2 class="section-title">ÚLTIMOS CRUCES</h2><button class="section-link" data-page="partidos">TODOS ${icons.chevron}</button></div>${matchesPanel()}<div class="aside mobile-aside">${sideExtra()}</div>`}
function finishedView(){const r=ranks('parejas')[0];return `<div class="finished"><div class="cup">${icons.trophy.replace('width="20" height="20"','width="65" height="65"')}</div><span class="small-lime">LA FECHA 01 TERMINÓ</span><h2>TENEMOS<br/>CAMPEONES.</h2><div class="winning">${r?escapeHTML(r.name):'SIN GANADOR'}</div><p>${r?`${r.g} victorias · ${r.pts} puntos`:'La fecha terminó sin partidos.'}</p>${state.awardMvp?`<p>MVP de la noche: <b>${escapeHTML(state.awardMvp)}</b></p>`:''}<div class="actions"><button class="primary-btn" data-action="export">${icons.download} GUARDAR TARJETA</button><button class="outline-mini" data-action="reopen">REABRIR FECHA</button></div></div>`}
function partidasPage(){const selected=state.filter;const mm=state.matches.filter(m=>selected==='todos'||m.mode===selected);return `${headerPage()}<div class="inner-hero"><div><span class="small-lime">EL MARCADOR</span><h2>CADA PARTIDO CUENTA.</h2><p>Cargá quién jugó y cómo terminó. La tabla se actualiza sola.</p></div><button class="primary-btn" data-modal="match">${icons.plus} CARGAR RESULTADO</button></div><div class="section-header"><h2 class="section-title">PARTIDOS JUGADOS (${mm.length})</h2></div><div class="tab-row">${[['todos','Todos'],['2v2','2 vs 2'],['1v1','1 vs 1']].map(x=>`<button class="tab ${selected===x[0]?'active':''}" data-filter="${x[0]}">${x[1]}</button>`).join('')}</div>${mm.length?`<div class="matches">${[...mm].reverse().map(m=>`<div class="match"><div class="match-index">#${String(m.id).padStart(2,'0')}</div><div class="match-team">${escapeHTML(m.a.join(' + '))}<span class="team-mini">${modeLabel(m.mode)}</span></div><div class="score-block"><span class="${(m.quick?m.winner==='a':m.sa>m.sb)?'winner':''}">${m.quick?(m.winner==='a'?'V':'D'):m.sa}</span><i>:</i><span class="${(m.quick?m.winner==='b':m.sb>m.sa)?'winner':''}">${m.quick?(m.winner==='b'?'V':'D'):m.sb}</span></div><div class="match-team right">${escapeHTML(m.b.join(' + '))}<span class="team-mini">${m.quick?(m.winner==='a'?'GANÓ LOCAL':'GANÓ VISITA'):m.sa===m.sb?'EMPATE':m.sa>m.sb?'GANÓ LOCAL':'GANÓ VISITA'}</span></div></div>`).join('')}</div>`:`<div class="empty">${icons.ball}<h3>SIN PARTIDOS</h3><p>Todavía no hay encuentros registrados en esta modalidad.</p></div>`}<p class="tip">Diseño de ejemplo. En la implementación final, cada partido tendrá acciones para corregirlo o eliminarlo.</p>`}
function rankingPage(){const filters=[['parejas','Parejas'],['jugadores','Jugadores 2vs2'],['uno','1 vs 1']],rr=ranks(state.rankMode);return `${headerPage()}<div class="inner-hero"><div><span class="small-lime">LA COMPETENCIA</span><h2>QUE HABLE<br/>LA TABLA.</h2><p>Victorias, derrotas y los que todavía no perdieron.</p></div><span style="color:var(--lime);width:60px">${icons.chart.replace('width="20" height="20"','width="60" height="60"')}</span></div><div class="tab-row">${filters.map(f=>`<button class="tab ${state.rankMode===f[0]?'active':''}" data-rank="${f[0]}">${f[1]}</button>`).join('')}</div>${rr.length?`<div class="board"><div class="board-cols"><span>#</span><span>${state.rankMode==='parejas'?'PAREJA':'JUGADOR'}</span><span style="text-align:center">PJ</span><span style="text-align:center">V</span><span style="text-align:center">PTS</span></div>${rr.map((r,i)=>`<div class="board-row ${i===0?'first':''}"><span class="position">${String(i+1).padStart(2,'0')}</span><span class="names">${escapeHTML(r.name)}<small>${r.e} empates · ${r.p} derrotas${r.gd!==0?' · DG '+(r.gd>0?'+':'')+r.gd:''}</small></span><span class="number">${r.pj}</span><span class="number">${r.g}</span><span class="points">${r.pts}</span></div>`).join('')}</div>`:`<div class="empty">${icons.chart}<h3>LA TABLA ESPERA</h3><p>Jugá un partido de esta modalidad para estrenar el ranking.</p></div>`}<p class="hint" style="margin-top:18px">Cada jugador suma puntos en su categoría. Las parejas se calculan según quiénes compartieron equipo, aunque cambien de compañeros.</p>`}
function historyPage(){return `${headerPage()}<div class="inner-hero"><div><span class="small-lime">ESTADÍSTICAS Y RECUERDOS</span><h2>LAS NOCHES<br/>QUEDAN.</h2><p>Resultados, campeones y premios de cada fecha.</p></div><span style="color:var(--gold);width:62px">${icons.trophy.replace('width="20" height="20"','width="62" height="62"')}</span></div><div class="section-header"><h2 class="section-title">TU HISTORIAL</h2></div><div class="past-night"><div><div class="date">FECHA 01 · ${state.finished?'FINALIZADA':'EN JUEGO'}</div><h3>${state.finished?'CAMPEONES DE LA NOCHE':'LA NOCHE SIGUE'}</h3><div class="detail">${state.matches.length} partidos · 6 jugadores · ${state.finished?'Fecha cerrada':'En vivo'}</div></div><div style="color:var(--lime)">${icons.calendar.replace('width="20" height="20"','width="32" height="32"')}</div></div><div class="empty" style="margin-top:16px">${icons.clock}<h3>RECIÉN EMPIEZA</h3><p>Cuando termines esta fecha, vas a tener tu primer registro en el historial.</p></div>`}
function shell(){let navs=[['inicio','grid','Inicio'],['partidos','ball','Partidos'],['ranking','chart','Ranking'],['historial','trophy','Historial']];return `<div class="app"><aside class="sidebar"><a class="brand" href="#" data-page="inicio"><span class="brand-mark">${icons.ball}</span><span class="brand-word">LA FECHA<small>TORNEOS ENTRE AMIGOS</small></span></a><div class="side-label">EL GRUPO</div><nav class="nav">${navs.map(n=>`<button class="nav-btn ${state.page===n[0]?'active':''}" data-page="${n[0]}">${icons[n[1]]}${n[2]}</button>`).join('')}</nav><div class="side-bottom"><div class="mini-overline">MI PLANTEL</div><div class="group-small">FIFA</div><div class="players-avatars">${playerNames.map(n=>face(n,'avatar')).join('')}</div><button class="bottom-side-link" data-modal="info">${icons.settings} ACERCA DE LA DEMO</button></div></aside><main class="main"><header class="topbar"><span class="top-crumb">GRUPOS ${icons.chevron} <b>FIFA</b> ${icons.chevron} FECHA 01</span><div class="top-right"><div class="live-state"><span class="live-dot"></span> ${state.finished?'FINALIZADA':'FECHA EN VIVO'}</div><button class="outline-mini" data-action="export">${icons.share} COMPARTIR TARJETA</button></div></header><header class="mobile-head"><div class="mobile-brand"><span class="brand-mark">${icons.ball}</span><span class="brand-word">LA FECHA<small>FIFA · 6 JUGADORES</small></span></div><div class="mobile-tools"><span class="mob-badge">${state.finished?'FINAL':'EN VIVO'}</span><button class="circle-tool" data-action="export" title="Guardar tarjeta">${icons.share}</button></div></header><div class="layout"><div class="content-grid"><div class="col-main fade-up">${{inicio:homePage,partidos:partidasPage,ranking:rankingPage,historial:historyPage}[state.page]()}</div><aside class="aside" style="${state.page==='inicio'?'':'padding-top:4px'}">${standingTop()}${state.page==='inicio'?'':sideExtra()}</aside></div></div><nav class="mobile-nav" aria-label="Navegación">${navs.map(n=>`<button class="${state.page===n[0]?'active':''}" data-page="${n[0]}">${icons[n[1]]}<span>${n[2]}</span></button>`).join('')}</nav></main></div>${modalHtml()}${state.toast?`<div class="toast" role="status">${escapeHTML(state.toast)}</div>`:''}`}
function modalHtml(){if(!state.modal)return '';let inner='';if(state.modal==='match'){const max=state.gameMode==='2v2'?4:2;let teamA=state.selected.slice(0,state.gameMode==='2v2'?2:1),teamB=state.selected.slice(state.gameMode==='2v2'?2:1,max);inner=`<div class="dialog-top"><div><div class="dialog-kicker">NUEVO ENCUENTRO</div><h2>CARGAR RESULTADO</h2></div><button class="close" data-close title="Cerrar">${icons.close}</button></div><div class="dialog-body"><div class="step-label">01 / MODALIDAD DE JUEGO</div><div class="mode-choice"><button data-mode="2v2" class="${state.gameMode==='2v2'?'active':''}">2 VS 2</button><button data-mode="1v1" class="${state.gameMode==='1v1'?'active':''}">1 VS 1</button></div><div class="form-line"><div class="step-label">02 / ELEGÍ A LOS JUGADORES (${state.selected.length}/${max})</div><button class="small-btn" data-action="shuffle">${icons.shuffle} SORTEAR</button></div><div class="choices">${playerNames.map(n=>`<button class="choice ${state.selected.includes(n)?'selected':''}" data-player="${n}">${face(n)} ${n}</button>`).join('')}</div><div class="choose-status">${state.selected.length===max?'Equipos listos. Cargá el marcador.':`Tocá los nombres en orden para armar los equipos.`}</div><div class="teams-visual"><div class="team-preview"><div class="team-label">EQUIPO A</div><div class="team-name">${teamA.join(' + ')||'Por definir'}</div></div><div class="versus">VS</div><div class="team-preview"><div class="team-label">EQUIPO B</div><div class="team-name">${teamB.join(' + ')||'Por definir'}</div></div></div><div class="step-label">03 / RESULTADO</div><div class="tab-row" style="padding-bottom:4px"><button class="tab ${state.inputMode==='marcador'?'active':''}" data-input="marcador">Marcador</button><button class="tab ${state.inputMode==='ganador'?'active':''}" data-input="ganador">Solo ganador</button></div>${state.inputMode==='marcador'?`<div class="score-edit"><div class="score-control"><button aria-label="Restar local" data-score="a,-1">−</button><b>${state.sa}</b><button aria-label="Sumar local" data-score="a,1">+</button></div><div class="score-divider">:</div><div class="score-control"><button aria-label="Restar visitante" data-score="b,-1">−</button><b>${state.sb}</b><button aria-label="Sumar visitante" data-score="b,1">+</button></div></div>`:`<div class="quick-winner"><button class="${state.quickWinner==='a'?'active':''}" data-winner="a">Ganó equipo A</button><button class="${state.quickWinner==='b'?'active':''}" data-winner="b">Ganó equipo B</button></div>`}<button class="primary-btn form-submit" data-action="save-match" ${state.selected.length!==max||state.finished?'disabled':''}>GUARDAR PARTIDO ${icons.chevron}</button></div>`;
}else if(state.modal==='awards'){inner=`<div class="dialog-top"><div><div class="dialog-kicker">EL TERCER TIEMPO</div><h2>PREMIOS DE LA NOCHE</h2></div><button class="close" data-close>${icons.close}</button></div><div class="dialog-body"><p class="hint" style="margin:0 0 22px">Elegí los premios opcionales. La pareja ganadora la calcula la tabla.</p><div class="award-fields"><div class="form-group"><label>EL MVP DE LA NOCHE</label><select id="awardMvp"><option value="">Sin elegir</option>${playerNames.map(n=>`<option ${state.awardMvp===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="form-group"><label>EL AUTOR DEL MEJOR GOL</label><select id="awardGol"><option value="">Sin elegir</option>${playerNames.map(n=>`<option ${state.awardGol===n?'selected':''}>${n}</option>`).join('')}</select></div></div><div class="notice">Cuando cierren la fecha, se genera una tarjeta de campeones para compartir. Los premios no son obligatorios.</div><button class="primary-btn form-submit" data-action="finish">${icons.trophy} FINALIZAR FECHA</button><button class="outline-mini" style="width:100%;margin-top:10px" data-action="save-awards">GUARDAR PREMIOS Y SEGUIR JUGANDO</button></div>`;
}else if(state.modal==='info'){inner=`<div class="dialog-top"><div><div class="dialog-kicker">CONCEPTO DE DISEÑO</div><h2>ESTÁS EN UN PROTOTIPO</h2></div><button class="close" data-close>${icons.close}</button></div><div class="dialog-body"><p class="hint">Esta versión muestra una propuesta visual interactiva. Los seis jugadores y cuatro resultados iniciales son datos de ejemplo.</p><p class="hint">Podés cambiar de pantalla, cargar partidos, ver cómo se recalcula la tabla y exportar la tarjeta de campeones. No hay conexión a tu base de datos.</p><button class="primary-btn form-submit" data-action="reset">REINICIAR PARTIDOS DE LA DEMO</button></div>`}
return `<div class="overlay" data-overlay><div class="dialog" role="dialog" aria-modal="true" aria-label="${state.modal==='match'?'Cargar partido':'Diálogo de la aplicación'}">${inner}</div></div>`;
}
function render(){document.getElementById('root').innerHTML=shell();}
function notify(msg){state.toast=msg;render();clearTimeout(state.noticeTimer);state.noticeTimer=setTimeout(()=>{state.toast='';render()},2700)}
function saveAwards(){state.awardMvp=document.getElementById('awardMvp')?.value||'';state.awardGol=document.getElementById('awardGol')?.value||''}
function chooseMode(v){state.gameMode=v;state.selected=[];state.sa=0;state.sb=0;render()}
function exportCard(){const rank=ranks('parejas')[0];const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1350;const ctx=canvas.getContext('2d');const W=canvas.width,H=canvas.height;
const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#10221b');bg.addColorStop(.55,'#152c25');bg.addColorStop(1,'#0a1211');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#bddf7b28';ctx.lineWidth=4;ctx.strokeRect(65,65,950,1220);ctx.beginPath();ctx.arc(850,450,250,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(850,450,170,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(560,130);ctx.lineTo(560,1230);ctx.stroke();
ctx.fillStyle='#c5f64c';ctx.fillRect(84,90,64,9);ctx.font='bold 42px Arial';ctx.fillText('LA FECHA',84,160);ctx.fillStyle='#b3c9b9';ctx.font='bold 25px Arial';ctx.fillText('FIFA  /  FECHA 01',84,212);
ctx.fillStyle='#c5f64c';ctx.font='bold 48px Arial';ctx.fillText('LOS DUEÑOS DE',84,435);
ctx.fillStyle='#ffffff';ctx.font='900 130px Impact, Arial Narrow, sans-serif';ctx.fillText('LA NOCHE.',76,550);
ctx.fillStyle='#c5f64c';ctx.font='bold 32px Arial';ctx.fillText('PAREJA LÍDER',84,692);
const winner=rank?.name||'SIN GANADOR';ctx.fillStyle='#f8ffea';ctx.font='900 90px Impact, Arial Narrow, sans-serif';let wsize=90;while(ctx.measureText(winner.toUpperCase()).width>920 && wsize>43){wsize-=3;ctx.font=`900 ${wsize}px Impact, Arial Narrow, sans-serif`};ctx.fillText(winner.toUpperCase(),84,802);
ctx.fillStyle='#b8cabb';ctx.font='bold 31px Arial';ctx.fillText(`${rank?.g??0} VICTORIAS   ·   ${rank?.pts??0} PUNTOS`,84,886);
ctx.strokeStyle='#6c8c67';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(84,962);ctx.lineTo(990,962);ctx.stroke();ctx.fillStyle='#d5f4bd';ctx.font='bold 34px Arial';ctx.fillText('LA CANCHA NO MIENTE.',84,1060);ctx.fillStyle='#91aa9c';ctx.font='bold 22px Arial';ctx.fillText(`${state.matches.length} PARTIDOS  /  6 JUGADORES`,84,1120);
const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='la-fecha-campeones.png';a.click();notify('Tarjeta exportada como PNG');}
function onClick(e){const b=e.target.closest('button,[data-page]');if(!b){if(e.target.matches('[data-overlay]')){state.modal=null;render()}return}if(b.hasAttribute('data-page')){e.preventDefault();state.page=b.dataset.page;render();window.scrollTo({top:0,behavior:'instant'});return}if(b.hasAttribute('data-modal')){state.modal=b.dataset.modal;render();return}if(b.hasAttribute('data-close')){state.modal=null;render();return}if(b.hasAttribute('data-mode')){chooseMode(b.dataset.mode);return}if(b.hasAttribute('data-player')){const n=b.dataset.player,max=state.gameMode==='2v2'?4:2,idx=state.selected.indexOf(n);if(idx!==-1)state.selected.splice(idx,1);else if(state.selected.length<max)state.selected.push(n);render();return}if(b.hasAttribute('data-score')){const [team,diff]=b.dataset.score.split(',');state[team==='a'?'sa':'sb']=Math.max(0,Math.min(99,state[team==='a'?'sa':'sb']+Number(diff)));render();return}if(b.hasAttribute('data-filter')){state.filter=b.dataset.filter;render();return}if(b.hasAttribute('data-rank')){state.rankMode=b.dataset.rank;render();return}if(b.hasAttribute('data-input')){state.inputMode=b.dataset.input;render();return}if(b.hasAttribute('data-winner')){state.quickWinner=b.dataset.winner;render();return}const action=b.dataset.action;if(!action)return;
if(action==='shuffle'){state.selected=[...playerNames].sort(()=>Math.random()-.5).slice(0,state.gameMode==='2v2'?4:2);state.sa=0;state.sb=0;render();return}
if(action==='save-match'){if(state.finished)return;const cut=state.gameMode==='2v2'?2:1,max=cut*2;if(state.selected.length!==max)return;const a=state.selected.slice(0,cut),bbb=state.selected.slice(cut,max);let sa=state.inputMode==='marcador'?state.sa:state.quickWinner==='a'?null:null;let sb=state.inputMode==='marcador'?state.sb:state.quickWinner==='b'?null:null;
// El modo 'solo ganador' no inventa un marcador. Se guarda el resultado del encuentro separado de los goles.
const quick=state.inputMode==='ganador';if(quick){sa=null;sb=null}
state.matches.push({id:Math.max(...state.matches.map(x=>x.id),0)+1,mode:state.gameMode,a,b:bbb,sa,sb,quick,winner:quick?state.quickWinner:null});state.modal=null;state.selected=[];state.sa=0;state.sb=0;state.page='inicio';notify('Resultado guardado. Ranking actualizado.');return}
if(action==='save-awards'){saveAwards();state.modal=null;notify('Premios guardados para esta fecha');return}
if(action==='finish'){saveAwards();state.finished=true;state.modal=null;state.page='inicio';notify('¡Fecha cerrada!');return}
if(action==='reopen'){state.finished=false;notify('Fecha reabierta');return}
if(action==='export'){exportCard();return}
if(action==='reset'){state.matches=[];state.finished=false;state.modal=null;state.page='inicio';notify('Demo reiniciada. Cargá el primer partido.');return}
}
document.addEventListener('click',onClick);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render()}});render();
</script>
</body></html>
