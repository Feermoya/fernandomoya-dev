name: Finance checks
on:
  push:
    paths:
      - 'src/components/finance/**'
      - 'src/lib/finance/**'
      - 'src/hooks/finance/**'
      - 'scripts/finance-api/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/finance-checks.yml'
  pull_request:
    paths:
      - 'src/components/finance/**'
      - 'src/lib/finance/**'
      - 'src/hooks/finance/**'
      - 'scripts/finance-api/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
